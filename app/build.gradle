plugins {
    id 'com.android.application'
}

android {
    namespace 'com.corretrilhos.byvictorjv'
    compileSdk 35

    defaultConfig {
        applicationId 'com.corretrilhos.byvictorjv'
        minSdk 23
        targetSdk 35
        versionCode 2
        versionName '1.0.1'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildTypes {
        debug {
            minifyEnabled false
        }
        release {
            minifyEnabled false
        }
    }
}