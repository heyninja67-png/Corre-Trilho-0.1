name: Build Corre Trilho APK

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Compile Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o código
        uses: actions/checkout@v7

      - name: Configurar Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-36 build-tools;35.0.0'

      - name: Instalar Gradle 8.13
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.13'

      - name: Compilar APK Debug
        run: gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Preparar nome do APK
        run: cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/Corre-Trilho.apk

      - name: Publicar APK como artefato
        uses: actions/upload-artifact@v4
        with:
          name: Corre-Trilho-APK
          path: app/build/outputs/apk/debug/Corre-Trilho.apk
          if-no-files-found: error
          retention-days: 30

      - name: Anexar APK à Release quando houver tag
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: app/build/outputs/apk/debug/Corre-Trilho.apk
